<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kon The Louis Vuitton Don</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Album Title</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Kon The Louis Vuitton Don",
  cover: "konthelouisvuittondoncover.jpg",
  songs: [
      { file: "konthelouisvuittondonintro.mp3", title: "Intro", artist: "Kanye West" },
      { file: "betterthanyours.mp3", title: "Better Than Yours", artist: "Kanye West, Common" },
      { file: "chasethedevil.mp3", title: "Chase The Devil", artist: "Kanye West, Lee Scratch Perry" },
      { file: "chaseyououttahere.mp3", title: "Chase You Outta Here", artist: "Kanye West, 50 Cent" },
      { file: "luci.mp3", title: "Lucifer", artist: "Kanye West, JAY-Z" },
      { file: "encore.mp3", title: "Encore", artist: "Kanye West, JAY-Z, John Legend, Don C, GLC" },
      { file: "youdontknowmyname.mp3", title: "You Don't Know My Name", artist: "Kanye West, Alicia Keys" },
      { file: "knockknockremix.mp3", title: "Knock Knock (Remix)", artist: "Kanye West, Monica" },
      { file: "wouldntyoulike2ryde.mp3", title: "Wouldn't You Like 2 Ryde", artist: "Kanye West, Malik Yusef, Common" },
      { file: "meagainstthemusic.mp3", title: "Me Against The Music", artist: "Kanye West, Britney Spears, Madonna" },
      { file: "nomoreforme.mp3", title: "No More For Me", artist: "Kanye West, Mark Spitz" },
      { file: "keepthereceipt.mp3", title: "Keep The Receipt", artist: "Kanye West, Ol' Dirty Bastard" },
      { file: "freestyle.mp3", title: "Freestyle", artist: "Kanye West, JAY-Z" },
      { file: "standupremix.mp3", title: "Stand Up (Remix)", artist: "Kanye West, Ludacris" },
      { file: "dogsout.mp3", title: "Dog's Out", artist: "Kanye West, DMX" },
      { file: "doinmyjob.mp3", title: "Doin My Job", artist: "Kanye West, T.I." },
      { file: "turnyaselfin.mp3", title: "Turn Yaself In", artist: "Kanye West, Consequence" },
      { file: "03til.mp3", title: "03 Til'...", artist: "Kanye West, Consequence" },
      { file: "defense.mp3", title: "Defense", artist: "Kanye West, GLC, Meka" },
      { file: "throughthewireremix.mp3", title: "Through The Wire (Remix)", artist: "Kanye West" },
      { file: "you.mp3", title: "You", artist: "Kanye West, Mela" },
      { file: "certifiedgangstas.mp3", title: "Certified Gangstas", artist: "Kanye West, Jim Jones" }

  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "song";

    div.innerHTML = `
      <strong>${song.title}</strong><br>
      <small>${song.artist || ""}</small>
    `;

    div.onclick = () => playSong(i);

    songsDiv.appendChild(div);
  });
}

// PLAY SONG
function playSong(i) {
  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
    if (!currentAlbum) return;

    const nextIndex = currentIndex + 1;

    if (nextIndex < currentAlbum.songs.length) {
      playSong(nextIndex);
    } else {
      playSong(0);
    }
  });

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});
  
</script>

</body>
</html>
